name: 📊 Relatório de Análises

on:
  schedule:
    - cron: '0 9 * * 1'    # Toda segunda-feira às 9h UTC
  workflow_dispatch:        # Permite rodar manualmente

jobs:
  analytics-report:
    name: Gerar Relatório Semanal
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔑 Permissão Gradle
        run: chmod +x gradlew

      - name: 🔨 Build e Testes
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lint --no-daemon

      - name: 📏 Coletar métricas
        id: metrics
        run: |
          DEBUG_SIZE=$(du -sh app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | cut -f1 || echo "N/A")
          RELEASE_SIZE=$(du -sh app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null | cut -f1 || echo "N/A")
          KOTLIN_FILES=$(find app/src/main -name "*.kt" | wc -l)
          TOTAL_LINES=$(find app/src/main -name "*.kt" -exec wc -l {} + | tail -1 | awk '{print $1}')
          echo "debug_size=$DEBUG_SIZE" >> $GITHUB_OUTPUT
          echo "release_size=$RELEASE_SIZE" >> $GITHUB_OUTPUT
          echo "kotlin_files=$KOTLIN_FILES" >> $GITHUB_OUTPUT
          echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT

      - name: 📋 Criar Issue de Relatório Semanal
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toLocaleDateString('pt-BR');
            const week = Math.ceil(new Date().getDate() / 7);
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Relatório Semanal DeepMule - ${date}`,
              body: `## 📊 Relatório Semanal - ${date}
            
            ### 📱 Tamanho dos APKs
            | Tipo | Tamanho |
            |------|---------|
            | Debug | ${{ steps.metrics.outputs.debug_size }} |
            | Release | ${{ steps.metrics.outputs.release_size }} |
            
            ### 💻 Código
            | Métrica | Valor |
            |---------|-------|
            | Arquivos Kotlin | ${{ steps.metrics.outputs.kotlin_files }} |
            | Linhas de código | ${{ steps.metrics.outputs.total_lines }} |
            | Branch | \`${context.ref}\` |
            | Commit | \`${context.sha.substring(0, 7)}\` |
            
            ### ✅ Status dos Builds
            | Etapa | Status |
            |-------|--------|
            | Build Debug | ✅ |
            | Build Release | ✅ |
            | Testes Unitários | ✅ |
            | Lint | ✅ |
            
            ---
            *Relatório gerado automaticamente pelo GitHub Actions*`,
              labels: ['analytics', 'weekly-report', 'automated']
            });

      - name: 📱 Guardar APKs como Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: apks-weekly-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

