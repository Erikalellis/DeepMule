name: 📦 Release APK

on:
  push:
    tags:
      - 'v*.*.*'        # ex: v1.0.0, v1.2.3
  workflow_dispatch:    # permite rodar manualmente no GitHub

jobs:
  release:
    name: Gerar Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔑 Permissão Gradle
        run: chmod +x gradlew

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 🧪 Rodar Testes
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 🔨 Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 📏 Verificar tamanho APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_SIZE=$(du -sh $APK_PATH | cut -f1)
          echo "APK Release gerado: $APK_SIZE"
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV

      - name: 🚀 Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DeepMule ${{ github.ref_name }}"
          body: |
            ## 📱 DeepMule ${{ github.ref_name }}

            ### 📥 Download
            Baixe o APK abaixo e instale no seu aparelho Android.

            > ⚠️ Para instalar, ative **"Instalar de fontes desconhecidas"** nas configurações do seu dispositivo.

            ### 📊 Informações
            - **Tamanho:** ${{ env.APK_SIZE }}
            - **Min Android:** 7.0 (API 24)
            - **Idioma:** Português Brasil (pt-BR)
            - **Build:** ${{ github.sha }}

            ### 🆕 Novidades
            Veja o histórico de commits para detalhes das mudanças.
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

